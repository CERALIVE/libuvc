name: Build Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libusb-1.0-0-dev libjpeg-dev ccache

      - name: Record compiler identity
        id: compiler
        run: |
          fingerprint="$({ cc --version; c++ --version; } | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ steps.compiler.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ steps.compiler.outputs.fingerprint }}-

      - name: Configure bounded ccache
        run: |
          ccache -M "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Configure (auto-detach ON)
        run: |
          cmake -B build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_TEST=OFF \
            -DLIBUVC_AUTO_DETACH_KERNEL_DRIVER=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Verify capabilities present
        run: |
          echo "=== H.265 support ==="
          grep -r "UVC_FRAME_FORMAT_H265" include/ && echo "PASS: H265 enum present"

          echo "=== UVC 1.5 header ==="
          grep -r "0x0150" src/ && echo "PASS: UVC 1.5 case present"

          echo "=== Configurable auto-detach ==="
          grep "LIBUVC_AUTO_DETACH_KERNEL_DRIVER" CMakeLists.txt && echo "PASS: auto-detach option present"

      - name: Configure + build (auto-detach OFF — rollback path)
        run: |
          cmake -B build-off \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_EXAMPLE=OFF \
            -DBUILD_TEST=OFF \
            -DLIBUVC_AUTO_DETACH_KERNEL_DRIVER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-off --parallel
          echo "PASS: OFF variant builds cleanly"

      - name: Verify artifacts
        run: |
          test -f build/libuvc.so
          echo "PASS: shared library produced"
          test -f build/libuvc.a
          echo "PASS: static library produced"

      - name: Show ccache statistics
        if: ${{ always() }}
        run: ccache --show-stats

      - name: Enforce ccache bound
        if: ${{ always() }}
        run: ccache -c
